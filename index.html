<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="googlebot" content="noindex, nofollow" />
    <meta name="theme-color" content="#FBF9FA" />
    <title>Ade &amp; Omolade</title>
    <script>
      // Day or night before the first paint: the visitor's last choice, else their device setting.
      ;(function () {
        var t = null
        try { t = localStorage.getItem('theme') } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.setAttribute('data-theme', t)
        if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0D0F1E')
      })()
    </script>
